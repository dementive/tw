# Builds tw (the dev build: ASan + UBSan) and runs its tests on Arch Linux,
# which CachyOS is built on: on every push to master, and once a week, so
# that a system update that breaks tw shows up before the next rebuild on
# the laptops. One job, no actions from elsewhere, no cache. The budget test
# is left out: its memory figure is the machine's as much as tw's.
name: test
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # --init: something has to reap what tw leaves behind, as systemd does
    # on a real machine; the tests wait for its helpers to be gone.
    container:
      image: archlinux:latest
      options: --init
    timeout-minutes: 20
    steps:
      - name: Install what tw builds against (docs/setup.md)
        run: |
          pacman -Syu --noconfirm --needed meson ninja gcc git pkgconf \
            wayland wayland-protocols libxkbcommon libinput pixman libdrm \
            mesa libglvnd systemd-libs seatd hwdata freetype2 fontconfig \
            noto-fonts dbus
          useradd -m build
      # As a user, not root: the tests of the root helpers expect what an
      # ordinary user may and may not do.
      - name: Fetch
        run: |
          runuser -u build -- sh -ec '
            cd ~ && git init -q tw && cd tw
            git fetch -q --depth 1 "$0" "$1" && git checkout -q FETCH_HEAD
          ' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Build
        run: runuser -u build -- sh -ec 'cd ~/tw && meson setup build -Db_sanitize=address,undefined && ninja -C build'
      - name: Test
        run: |
          runuser -u build -- sh -ec 'cd ~/tw && meson test -C build --suite tw ||
            { grep -h "^FAIL" build/meson-logs/testlog.txt; exit 1; }'
