# Which xdg-desktop-portal backends serve programs running under tw.
# Screen capture (OBS, browsers, video calls) comes from
# xdg-desktop-portal-wlr; file dialogs and the rest from the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
