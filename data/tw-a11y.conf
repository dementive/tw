# Added to at-spi-dbus-bus.service, the accessibility bus: it starts only in
# a session that has not said to leave accessibility alone.
#
# tw-session says so with NO_AT_BRIDGE, which it also hands to systemd, unless
# it was started with TW_A11Y=1. GTK programs obey that variable themselves.
# Chromium and Electron programs do not: they ask the session bus where the
# accessibility bus is as they start, and the session bus starts this unit
# to answer. With this the program is told at once that there is none.
[Unit]
ConditionEnvironment=!NO_AT_BRIDGE
