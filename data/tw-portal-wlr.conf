# How xdg-desktop-portal-wlr asks what to share (OBS, a browser sharing the
# screen) in a tw session: tw-launch lists the screens and the windows, and
# the one picked is shared. Left to itself the portal asks through slurp
# when that is installed, which can pick only a screen. A file of the same
# name in ~/.config/xdg-desktop-portal-wlr/ comes before this one.
[screencast]
chooser_type=dmenu
chooser_cmd=tw-launch --dmenu -p 'Share: '
