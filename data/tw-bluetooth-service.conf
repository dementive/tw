# Added to bluetooth.service: the Bluetooth service starts only while
# Bluetooth is switched on with tw-bluetooth, which is for as long as the
# root helper's note is there.
#
# Without this it cannot be stopped. The sound service takes its leave of
# the Bluetooth service the moment that one is gone, and the system bus
# starts a service that is called while it is not running. Seen on the first
# switch-off: started again seven milliseconds after it had stopped, with
# the modules still loaded for it to hold on to.
[Unit]
ConditionPathExists=/run/tw-bluetooth
