# Installed as logind.conf.d/tw.conf: what the power key does.
#
# logind powers the machine off at a short press of the power key unless a
# desktop takes the key and asks first, as KDE does. tw asks nothing, and on
# a laptop whose power key is on the keyboard or beside the USB ports, one
# stray press ended the session and everything in it. So a short press does
# nothing, and holding the key for five seconds powers off cleanly, unless
# the firmware cuts the power before that. `systemctl poweroff` always does.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
